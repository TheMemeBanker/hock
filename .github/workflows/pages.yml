name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build static copy
        working-directory: web
        env:
          # Project-page preview until hock.fun points here; then set NEXT_PUBLIC_BASE_PATH to "" and PAGES_CNAME to hock.fun.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH != '' && vars.PAGES_BASE_PATH || '/hock' }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: bash scripts/static-export.sh ./out-static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
